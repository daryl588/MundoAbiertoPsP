
name: Build PSP EBOOT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspsdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build using PSPSDK
        run: |
          make clean || true
          make
          mkdir -p build
          cp EBOOT.PBP build/EBOOT.PBP

      - uses: actions/upload-artifact@v4
        with:
          name: MundoAbiertoPSP-EBOOT
          path: build/EBOOT.PBP
